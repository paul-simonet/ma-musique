<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..800,100,1&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Live Studio</h1>
    <span class="onair" id="onair">On Air</span>
    <button class="back" id="back" type="button" hidden>↩ Revenir au direct</button>
    <div class="sort-wrap">
      <span class="sort-label" id="sort-label">Ranger par</span>
      <nav class="sort" aria-labelledby="sort-label">
        <button type="button" data-sort="time">Heure</button>
        <button type="button" data-sort="genre">Genre</button>
        <button type="button" data-sort="alpha">A–Z</button>
        <button type="button" data-sort="plays">Écoutes</button>
      </nav>
    </div>
  </header>

  <p class="banner" id="banner" hidden></p>

  <main class="bookcase" id="bookcase">
    <section class="niche" aria-label="La platine">
      <div class="stage">
        <!-- la platine est une vraie boîte en 3D : dessus, face avant et côtés partagent les mêmes arêtes -->
        <div class="box">
          <div class="lid" id="deck">
            <div class="plate">
              <span class="engrave">Last Stereo<br>ST-70 · Direct Drive</span>
              <div class="platter">
                <div class="record" id="record">
                  <div class="grooves" aria-hidden="true"></div>
                  <div class="hole" aria-hidden="true"></div>
                  <span class="record-text" id="record-text"></span>
                </div>
                <div class="sheen" aria-hidden="true"></div>
              </div>
              <span class="rest" aria-hidden="true"></span>
              <svg class="tonearm" id="tonearm" viewBox="0 0 120 660" aria-hidden="true">
                <rect x="44" y="0" width="32" height="44" rx="6" class="arm-weight"/>
                <circle cx="60" cy="60" r="34" class="arm-base"/>
                <circle cx="60" cy="60" r="14" class="arm-cap"/>
                <path d="M60 60 L60 500 Q60 530 50 560" class="arm-tube"/>
                <path d="M38 550 L66 556 L60 612 L34 606 Z" class="arm-head"/>
              </svg>
              <span class="pitch" aria-hidden="true"><i></i></span>
            </div>
          </div>
          <div class="front" aria-hidden="true">
            <span class="badge">LAST <b>STEREO</b></span>
            <span class="model">ST-70</span>
            <span class="power" id="power"></span>
            <span class="speed">33⅓</span>
            <span class="knob"></span><span class="knob"></span>
          </div>
          <div class="side left" aria-hidden="true"></div>
          <div class="side right" aria-hidden="true"></div>
        </div>
      </div>

      <article class="card" id="card" aria-live="polite">
        <p class="kicker" id="kicker">—</p>
        <h2 id="title">—</h2>
        <p class="meta" id="meta"></p>
        <ul class="facts" id="facts" aria-label="Infos"></ul>
      </article>

      <section class="stats" aria-label="Ma semaine en chiffres">
        <p class="stats-title">Cette semaine</p>
        <div class="clock" id="clock" aria-label="Écoutes par heure de la journée"></div>
        <div class="clock-axis" aria-hidden="true"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>24h</span></div>
        <ul class="tiles" id="tiles"></ul>
      </section>
    </section>
    <!-- les 4 étages sont ajoutés ici par app.js -->
  </main>

  <script src="app.js"></script>
</body>
</html>
